<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı — HepsiBirarada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e; color: #fff; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .card {
            text-align: center; max-width: 400px;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; margin-bottom: 8px; }
        p { color: #818cf8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #4f46e5; color: #fff; border: none; padding: 12px 32px;
            border-radius: 24px; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Çevrimdışısınız</h1>
        <p>İnternet bağlantınız kesildi. Bağlantı geri geldiğinde mağazaya otomatik dönebilirsiniz.</p>
        <button onclick="location.reload()">Tekrar Dene</button>
    </div>
</body>
</html>
